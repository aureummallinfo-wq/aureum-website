# Hostinger VPS reverse proxy for the Docker container.
# Install this as the aureummall.info server block after confirming the host's
# existing Nginx/CloudPanel layout. The container stays private on 127.0.0.1:3010.

proxy_cache_path /var/cache/nginx/aureum levels=1:2 keys_zone=aureum_static:20m max_size=2g inactive=30d use_temp_path=off;

upstream aureum_next {
  server 127.0.0.1:3010;
  keepalive 32;
}

server {
  listen 80;
  server_name aureummall.info www.aureummall.info;

  location / {
    proxy_pass http://aureum_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
  }

  location ~* ^/_next/static/ {
    proxy_pass http://aureum_next;
    proxy_cache aureum_static;
    proxy_cache_valid 200 365d;
    proxy_cache_lock on;
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Cache $upstream_cache_status always;
  }

  location ~* ^/(assets|video)/ {
    proxy_pass http://aureum_next;
    proxy_cache aureum_static;
    proxy_cache_valid 200 7d;
    proxy_cache_lock on;
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=2592000" always;
    add_header X-Cache $upstream_cache_status always;
  }

  location = /_next/image {
    proxy_pass http://aureum_next;
    proxy_cache aureum_static;
    proxy_cache_valid 200 7d;
    proxy_cache_lock on;
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=2592000" always;
    add_header X-Cache $upstream_cache_status always;
  }
}

